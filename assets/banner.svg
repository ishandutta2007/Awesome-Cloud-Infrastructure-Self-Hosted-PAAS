<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Vibrant Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="line-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Filter for glow effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Continuous subtle pulse animation for glowing orbs */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.18); opacity: 0.42; }
    }
    /* Flowing dashed beam animation */
    @keyframes dashFlow {
      to { stroke-dashoffset: -120; }
    }
    /* Dynamic pulsing beacon ring */
    @keyframes beaconPing {
      0% { r: 5px; opacity: 0.9; }
      80% { r: 16px; opacity: 0; }
      100% { r: 18px; opacity: 0; }
    }
    .orb-left {
      transform-origin: 180px 140px;
      animation: pulseOrb 8s ease-in-out infinite alternate;
    }
    .orb-right {
      transform-origin: 1020px 240px;
      animation: pulseOrb 7s ease-in-out infinite alternate-reverse;
    }
    .flowing-beam {
      stroke-dasharray: 8, 12;
      animation: dashFlow 3s linear infinite;
    }
    .beacon-pulse {
      animation: beaconPing 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- DYNAMIC BACKGROUND ELEMENTS: Glowing Orbs (placed strictly behind all text) -->
  <g class="orb-left">
    <circle cx="180" cy="140" r="160" fill="#38bdf8" opacity="0.25" filter="url(#glow)" />
  </g>
  <g class="orb-right">
    <circle cx="1020" cy="240" r="190" fill="#a855f7" opacity="0.22" filter="url(#glow)" />
  </g>

  <!-- DYNAMIC BACKGROUND ANIMATED NETWORK / BEAM LINES (low opacity, decorative) -->
  <g stroke-linecap="round" opacity="0.55">
    <path class="flowing-beam" d="M 60,340 C 300,310 420,380 600,340 C 780,300 900,370 1140,330" fill="none" stroke="url(#line-glow)" stroke-width="2" />
    <path class="flowing-beam" d="M 80,80 C 350,120 500,40 750,90 C 950,130 1050,70 1120,100" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.35" />
  </g>

  <!-- BEACONS / NODES (BACKGROUND DECORATION) -->
  <circle cx="600" cy="340" r="4" fill="#38bdf8" />
  <circle class="beacon-pulse" cx="600" cy="340" r="6" fill="none" stroke="#38bdf8" stroke-width="2" />

  <circle cx="300" cy="310" r="3.5" fill="#818cf8" />
  <circle class="beacon-pulse" cx="300" cy="310" r="5" fill="none" stroke="#818cf8" stroke-width="1.5" />

  <circle cx="900" cy="370" r="3.5" fill="#c084fc" />
  <circle class="beacon-pulse" cx="900" cy="370" r="5" fill="none" stroke="#c084fc" stroke-width="1.5" />

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(600, 75)">
    <rect x="-185" y="-16" width="370" height="32" rx="16" fill="url(#pill-grad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <text text-anchor="middle" y="5" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.8">⚡ CLOUD INFRASTRUCTURE &amp; SELF-HOSTED PAAS</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title & Gradient Heading -->
  <text class="title" x="600" y="150" text-anchor="middle" font-size="44" font-weight="900" fill="url(#primary-grad)" letter-spacing="-0.8">Awesome Cloud Infrastructure &amp; PaaS</text>

  <!-- FOREGROUND CONTENT: Subtitle / Tagline -->
  <text class="subtitle" x="600" y="192" text-anchor="middle" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">Top Curated Developer Clouds, Self-Hosted PaaS Platforms &amp; Container Orchestrators</text>

  <!-- FOREGROUND CONTENT: Feature Highlights Bar (Pills clearly readable in foreground) -->
  <g transform="translate(600, 252)">
    <!-- Pill 1: Coolify & Dokploy -->
    <g transform="translate(-410, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pill-grad)" stroke="#334155" stroke-width="1.2" />
      <text class="node-text" text-anchor="middle" y="5" font-size="13" font-weight="600" fill="#f8fafc">🚀 Coolify &amp; Dokploy</text>
    </g>

    <!-- Pill 2: Kamal & Docker -->
    <g transform="translate(-205, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pill-grad)" stroke="#334155" stroke-width="1.2" />
      <text class="node-text" text-anchor="middle" y="5" font-size="13" font-weight="600" fill="#f8fafc">🐳 Kamal &amp; Docker</text>
    </g>

    <!-- Pill 3: Dokku & CapRover -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pill-grad)" stroke="#334155" stroke-width="1.2" />
      <text class="node-text" text-anchor="middle" y="5" font-size="13" font-weight="600" fill="#f8fafc">⛵ Dokku &amp; CapRover</text>
    </g>

    <!-- Pill 4: K8s & Cozystack -->
    <g transform="translate(205, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pill-grad)" stroke="#334155" stroke-width="1.2" />
      <text class="node-text" text-anchor="middle" y="5" font-size="13" font-weight="600" fill="#f8fafc">☸️ K8s &amp; Cozystack</text>
    </g>

    <!-- Pill 5: Railway & Render -->
    <g transform="translate(410, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pill-grad)" stroke="#334155" stroke-width="1.2" />
      <text class="node-text" text-anchor="middle" y="5" font-size="13" font-weight="600" fill="#f8fafc">☁️ Railway &amp; Render</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Bottom Metric Badges / Indicators -->
  <g transform="translate(600, 310)">
    <text text-anchor="middle" font-size="12" font-weight="500" fill="#64748b" letter-spacing="1.2">ZERO-DOWNTIME DEPLOYS • GIT-PUSH PAAS • MANAGED DATABASES • REVERSE PROXIES</text>
  </g>
</svg>
